<!DOCTYPE html>
<html>
<head>
    <title>Warehouse Automation Suite</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px; color: #333; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px; }
        h1 { color: #2c3e50; font-size: 36px; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 18px; margin-bottom: 40px; }
        
        .portal-grid { display: flex; gap: 30px; justify-content: center; }
        
        .portal-card {
            background: white; padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); width: 100%; max-width: 350px;
            text-decoration: none; color: #333; transition: transform 0.2s, box-shadow 0.2s;
            border-top: 6px solid #3498db;
        }
        .portal-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        
        .portal-card.pdf-card { border-top-color: #e67e22; }
        
        .portal-icon { font-size: 50px; margin-bottom: 20px; }
        .portal-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .portal-desc { font-size: 15px; color: #7f8c8d; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Packaging Automation Suite</h1>
    <p>Select a tool to begin processing your distributions.</p>

    <div class="portal-grid">
        <a href="/matrix" class="portal-card">
            <div class="portal-icon">📊</div>
            <div class="portal-title">1. Create Packing Sheets </div>
            <div class="portal-desc">Upload raw Excel Distros, calculate allocations, and generate Packing sheets.</div>
        </a>

        <a href="/pdf" class="portal-card pdf-card">
            <div class="portal-icon">🖨️</div>
            <div class="portal-title">2. Labels shuffler </div>
            <div class="portal-desc">Upload raw labels and sort them perfectly based on Signature Code groups.</div>
        </a>
    </div>
</div>

</body>
</html>
